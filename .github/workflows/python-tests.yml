name: Python application

on:
  push:
    branches: [ main ]
    tags:
      - '20*'
  pull_request:

permissions: {}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      # pre-commit/action has not been released since 2024 and pins
      # actions/cache@v4, which still targets the deprecated Node 20, so run
      # pre-commit ourselves and cache the hook environments here instead.
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEBUG: "False"
      SECRET_KEY: "github-actions-secret-key"

    services:
      postgres:
        image: postgres@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42 # 18.6
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      unoserver:
        image: ghcr.io/dochub-ulb/unoserver@sha256:e2310ed7e3fdc6c5e579f5565e1fe11c17c41c5432595f330b5de0eace32c570
        ports:
          - 2003:2003


    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

    - name: "Set up Python"
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version-file: ".python-version"

    - name: Apt update
      run: sudo apt update

    - name: Install apt packages
      run: sudo apt install -y mupdf-tools libmagic1 pipx

    - name: Install unoserver
      run: pipx install unoserver --system-site-packages

    - name: Install the project
      run: uv sync --dev

    - name: Django checks
      run: uv run ./manage.py check

    - name: Check migrations
      run: uv run ./manage.py makemigrations --dry-run --check

    - name: mypy
      run: uv run mypy

    - name: Statics checks
      run: uv run ./manage.py collectstatic --noinput -v 0

    - name: pytest with SQLite
      run: uv run pytest

    - name: pytest with PostgreSQL
      run: uv run pytest -m postgresql
      env:
        DB_URL: postgres://postgres:postgres@localhost:5432/postgres

    - name: Check local dev initialization scripts
      run: make database
