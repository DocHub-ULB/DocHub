name: Python application

on:
  push:
    branches: [ main ]
    tags:
      - '20*'
  pull_request:

permissions: {}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: false

      # pre-commit/action has not been released since 2024 and pins
      # actions/cache@v4, which still targets the deprecated Node 20, so run
      # pre-commit ourselves and cache the hook environments here instead.
      - name: Cache pre-commit environments
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@v6.1.0
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

  # Verify workflow coverage and the provenance of locked action revisions.
  lockfile:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Install actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      - name: Verify action lockfile
        run: gh actions-lock --verify

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEBUG: "False"
      SECRET_KEY: "github-actions-secret-key"

    services:
      postgres:
        image: postgres@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42 # 18.6
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      unoserver:
        image: ghcr.io/dochub-ulb/unoserver@sha256:e2310ed7e3fdc6c5e579f5565e1fe11c17c41c5432595f330b5de0eace32c570
        ports:
          - 2003:2003


    steps:
    - uses: actions/checkout@v6.1.0
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@v8.0.0
      with:
        enable-cache: false

    - name: "Set up Python"
      uses: actions/setup-python@v6.3.0
      with:
        python-version-file: ".python-version"

    - name: Apt update
      run: sudo apt update

    - name: Install apt packages
      run: sudo apt install -y mupdf-tools libmagic1 pipx

    - name: Install unoserver
      run: pipx install unoserver --system-site-packages

    - name: Install the project
      run: uv sync --dev

    - name: Django checks
      run: uv run ./manage.py check

    - name: Check migrations
      run: uv run ./manage.py makemigrations --dry-run --check

    - name: mypy
      run: uv run mypy

    - name: Statics checks
      run: uv run ./manage.py collectstatic --noinput -v 0

    - name: pytest with SQLite
      run: uv run pytest

    - name: pytest with PostgreSQL
      run: uv run pytest -m postgresql
      env:
        DB_URL: postgres://postgres:postgres@localhost:5432/postgres

    - name: Check local dev initialization scripts
      run: make database

  deploy:
    needs: [pre-commit, lockfile, build]
    runs-on: ubuntu-latest
    permissions: {}
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/20')
    steps:
      - name: Deploy ${{ github.ref_name }}
        env:
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          TAG: ${{ github.ref_name }}
        run: |
          PAYLOAD="{\"ref\":\"refs/tags/$TAG\"}"
          SIGNATURE="sha256=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | cut -d' ' -f2)"

          HTTP_CODE=$(curl -s --max-time 120 \
            -o /tmp/deploy-output.txt \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -d "$PAYLOAD" \
            "https://dochub.be/webhook/dochub-deploy")

          cat /tmp/deploy-output.txt

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Webhook returned HTTP $HTTP_CODE"
            exit 1
          fi
