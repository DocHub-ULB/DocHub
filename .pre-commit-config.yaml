repos:
  # Also runs in CI through the pre-commit job.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor

  - repo: https://github.com/thibaudcolas/curlylint
    rev: "v0.13.1"
    hooks:
      - id: curlylint
        types: [ file ]
        files: \.html$

  - repo: https://github.com/rtts/djhtml
    rev: '3.0.11'
    hooks:
      - id: djhtml
      - id: djcss
      - id: djjs

  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.32.0
    hooks:
      - id: django-upgrade

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: 'v0.16.7'
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/adamchainz/djade-pre-commit
    rev: '1.10.0'
    hooks:
    -   id: djade
        # djade 1.10 does not detect Django 6.x from pyproject.toml (it
        # silently applies no fixers), so give the version here.
        args: [--target-version, "6.1"]
