{% load static %}
<header class="topbar">
    <div class="topbar-inner">
        <a class="logo" href="{% url 'index' %}">
            <span class="logo-mark" aria-hidden="true">
                <span class="paper"></span>
                <span class="fold"></span>
                <span class="dot"></span>
            </span>
            <span><em>Doc</em>Hub</span>
        </a>

        <div class="search-bar" data-controller="autocomplete"
             data-autocomplete-url-value="/search/courses/"
             data-autocomplete-min-length-value="3"
        >
            {% include "icons/search.html" %}
            <input type="search"
                   placeholder="Cherche un cours…  ex: INFO-F-202, probabilités"
                   aria-label="Recherche"
                   data-autocomplete-target="input">
            <ul data-autocomplete-target="results" class="search-results" hidden></ul>
        </div>

        <div class="topbar-actions">
            <nav class="topnav">
                <a href="{% url "catalog:finder_root" %}">Catalogue</a>
            </nav>

            <a class="btn btn-accent" href="{% url "catalog:finder_root" %}">
                {% include "icons/upload.html" %}
                Déposer
            </a>
        </div>
    </div>
</header>
