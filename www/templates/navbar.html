{% load static %}
<header class="topbar">
    <div class="topbar-inner">
        <a class="logo" href="{% url 'index' %}">
            <span class="logo-mark" aria-hidden="true">
                <span class="pg"></span>
                <span class="fold"></span>
                <span class="dot"></span>
            </span>
            <span><em>Doc</em>Hub</span>
        </a>

        <div class="search-bar" data-controller="autocomplete"
             data-autocomplete-url-value="/search/courses/"
             data-autocomplete-min-length-value="3"
        >
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search"
                   placeholder="Cherche un cours, un doc, un tag…  ex: INFO-F-202, probabilités, formulaire"
                   aria-label="Recherche"
                   data-autocomplete-target="input">
            <ul data-autocomplete-target="results" class="search-results" hidden></ul>
        </div>

        <div class="topbar-actions">
            <nav class="topnav">
                <a href="{% url "catalog:finder_root" %}">Catalogue</a>
            </nav>

            <a class="btn btn-accent btn-sm" href="{% url "catalog:finder_root" %}">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v14"/><path d="m6 9 6-6 6 6"/><path d="M4 21h16"/></svg>
                Déposer
            </a>
        </div>
    </div>
</header>
